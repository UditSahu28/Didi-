<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#390b12">
  <title>For My Sister 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      color: #fff8f2; font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255,125,155,.25), transparent 35%),
        radial-gradient(ellipse at 85% 80%, rgba(255,190,120,.16), transparent 38%),
        linear-gradient(145deg, #21070d, #5a1018 52%, #26080f);
      display: grid; place-items: center; padding: 24px 14px;
    }
    body::before {
      content: ""; position: fixed; inset: -50%;
      background: repeating-conic-gradient(from 0deg, transparent 0 12deg, rgba(255,255,255,.025) 13deg 14deg);
      animation: rotate 70s linear infinite; pointer-events: none;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .sparkles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .sparkles span {
      position: absolute; bottom: -40px; opacity: 0;
      animation: floatUp var(--duration) linear infinite;
      animation-delay: var(--delay); left: var(--left); font-size: var(--size);
      filter: drop-shadow(0 0 8px rgba(255,180,200,.55));
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: .75; } 85% { opacity: .6; }
      100% { transform: translateY(-115vh) rotate(35deg); opacity: 0; }
    }
    .card {
      position: relative; z-index: 1; width: min(940px, 100%);
      padding: clamp(20px, 4vw, 42px);
      border: 1px solid rgba(255,220,225,.25); border-radius: 28px;
      background: rgba(30, 5, 12, .55);
      box-shadow: 0 25px 80px rgba(0,0,0,.38), inset 0 0 35px rgba(255,180,200,.06);
      backdrop-filter: blur(12px);
    }
    .top { text-align: center; margin-bottom: 24px; }
    .eyebrow { color: #ffc4d1; letter-spacing: .22em; text-transform: uppercase; font: 12px Arial,sans-serif; }
    h1 { margin: 8px 0 4px; font-size: clamp(38px, 8vw, 76px); font-style: italic; text-shadow: 0 5px 25px #ff718d66; }
    .subtitle { color: #f5cbd1; font-size: 15px; }
    .content { display: grid; grid-template-columns: minmax(0,1fr) minmax(180px,.8fr); gap: 28px; align-items: center; }
    .sequence {
      min-height: 470px; display: flex; flex-direction: column; justify-content: center;
      gap: 7px; padding: 12px 0;
    }
    .line {
      font-size: clamp(17px, 2.8vw, 27px); line-height: 1.18; font-weight: bold;
      opacity: 0; transform: translateY(12px); filter: blur(3px);
      animation: reveal .65s ease forwards;
      text-shadow: 0 2px 12px rgba(0,0,0,.3);
    }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    .final { color: #ffd2dc; text-shadow: 0 0 18px #ff789b88; }
    .hero {
      text-align: center; padding: 28px 10px;
      position: sticky; top: 20px;
    }
    .bow { font-size: 54px; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-9px) rotate(5deg); } }
    .hero-title {
      font-family: Arial, sans-serif; font-weight: 900; font-style: italic;
      font-size: clamp(42px, 7vw, 76px); letter-spacing: -4px;
      text-shadow: 0 7px 0 rgba(0,0,0,.15), 0 0 28px #ff9bb7aa;
      border-bottom: 4px solid #fff1f4; padding-bottom: 10px;
    }
    .heart { font-size: 48px; margin-top: 18px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { transform: scale(1.2); } }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    button {
      border: 1px solid #ffd5df88; border-radius: 999px; padding: 11px 18px;
      color: white; background: linear-gradient(135deg,#a52d4c,#6d1630);
      font-weight: bold; cursor: pointer; box-shadow: 0 5px 18px #0004;
    }
    button:hover { filter: brightness(1.15); }
    .note { text-align: center; color: #eec3cc; font: 12px Arial,sans-serif; margin-top: 15px; }
    audio { display: none; }
    @media (max-width: 650px) {
      .content { grid-template-columns: 1fr; gap: 5px; }
      .sequence { min-height: 0; order: 2; }
      .hero { order: 1; padding: 10px 0 22px; position: static; }
      .bow { font-size: 40px; }
      .hero-title { font-size: 54px; }
      .line { font-size: clamp(17px, 4.7vw, 23px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true" id="sparkles"></div>
  <main class="card">
    <header class="top">
      <div class="eyebrow">A little message from the heart</div>
      <h1>For My Sister</h1>
      <div class="subtitle">One word at a time… 💗</div>
    </header>

    <section class="content">
      <div class="sequence" id="sequence" aria-live="polite"></div>
      <div class="hero">
        <div class="bow">🎀</div>
        <div class="hero-title">Sister!!</div>
        <div class="heart">💗</div>
      </div>
    </section>

    <div class="controls">
      <button id="playBtn" type="button">▶ Play music</button>
      <button id="restartBtn" type="button">↻ Replay animation</button>
    </div>
    <p class="note">Your song is included 🎵 Tap “Play music” to listen.</p>
    <audio id="bgMusic" loop preload="none">
      <source src="music/music.mp3" type="audio/mpeg">
    </audio>
  </main>

  <script>
    // Edit the words or emojis here if you want.
    const messages = [
      ["S", "👩🏻 😻"],
      ["Si", "💜 🕊️"],
      ["Sis", "🫀 💋"],
      ["Sist", "🥰 👀"],
      ["Siste", "😇 💟"],
      ["Sister", "🌍 💞"],
      ["Sister I", "🫶🏻 🎀"],
      ["Sister I l", "🐣 🍂"],
      ["Sister I lo", "❣️ 🌀"],
      ["Sister I lov", "🚀 🌿"],
      ["Sister I love", "🐼 🥥"],
      ["Sister I love y", "👑 💫"],
      ["Sister I love yo", "🤍 🫂"],
      ["Sister I love you", "💎 🤞🏻"],
      ["Sister I love you s", "🙈 ⚡"],
      ["Sister I love you so", "🪷 👩🏻"],
      ["Sister I love you so m", "💙 🦶🏻"],
      ["Sister I love you so mu", "😘 ❤️"],
      ["Sister I love you so muc", "💃🏻 🌷"],
      ["Sister I love you so much", "🐸 🤚🏻"],
      ["Sister I love you so muchh", "🌝 ⭐"]
    ];

    const sequence = document.getElementById("sequence");
    const music = document.getElementById("bgMusic");
    const playBtn = document.getElementById("playBtn");
    let timers = [];

    function showSequence() {
      timers.forEach(clearTimeout);
      timers = [];
      sequence.innerHTML = "";
      messages.forEach((item, index) => {
        const timer = setTimeout(() => {
          const line = document.createElement("div");
          line.className = "line" + (index === messages.length - 1 ? " final" : "");
          line.textContent = item[0] + "  " + item[1];
          line.style.animationDelay = "0s";
          sequence.appendChild(line);
          line.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, index * 850); // Change 850 to control the speed (milliseconds).
        timers.push(timer);
      });
    }

    playBtn.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
          playBtn.textContent = "❚❚ Pause music";
        } catch (error) {
          alert("Add music.mp3 beside this HTML file, then tap Play music again.");
        }
      } else {
        music.pause();
        playBtn.textContent = "▶ Play music";
      }
    });

    document.getElementById("restartBtn").addEventListener("click", showSequence);
    music.addEventListener("pause", () => playBtn.textContent = "▶ Play music");
    music.addEventListener("play", () => playBtn.textContent = "❚❚ Pause music");

    // Floating hearts and sparkles in the background.
    const sparkleBox = document.getElementById("sparkles");
    ["💗","✨","💕","🌸","♡","💖","✦","🎀"].forEach((symbol, i) => {
      for (let n = 0; n < 3; n++) {
        const s = document.createElement("span");
        s.textContent = symbol;
        s.style.setProperty("--left", (Math.random() * 100) + "%");
        s.style.setProperty("--duration", (10 + Math.random() * 12) + "s");
        s.style.setProperty("--delay", (-Math.random() * 18) + "s");
        s.style.setProperty("--size", (14 + Math.random() * 18) + "px");
        sparkleBox.appendChild(s);
      }
    });

    showSequence();
  </script>
</body>
</html>
